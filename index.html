<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hog Supply Forecast &amp; Availability</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232a78d6%22/></svg>">
<style id="css">
:root{--bg:#f6f5f2;--surface:#fcfcfb;--line:#e4e2dc;--line2:#efede8;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--bad:#c23b3b;--warn:#a86400;--accent:#2a78d6;--r:10px;
font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--line:#33322f;--line2:#262624;--text:#f0efec;--text2:#c3c2b7;--muted:#8d8c86;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--bad:#e66767;--warn:#e0a03a;--accent:#3987e5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--text2);font-size:13px;margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px}
button:hover{border-color:var(--text2)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.sm{padding:3px 8px;font-size:12px}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
button.danger{color:var(--bad)}
.status{font-size:12px;color:var(--muted);margin-left:8px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.filters label{font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:center}
.muted{color:var(--muted);font-size:12px}
select,input,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--text2)}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.ph{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.ph h2{font-size:16px;margin:0}
.tbl{width:100%;overflow:auto;max-height:620px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--text2);text-align:left;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.num,th.num{text-align:right}
td.rm{white-space:normal;min-width:160px;max-width:300px;font-size:12px;color:var(--text2)}
tr.tot td{font-weight:650;border-top:1px solid var(--line)}
tr.cur td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
tr.br td{color:var(--muted)}
tr.grp td{border-top:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--text2)}
.pill.Prime{border-color:var(--s1);color:var(--s1)}
.pill.Oversize{border-color:var(--s2);color:var(--s2)}
.pill.Light{border-color:var(--s3);color:var(--s3)}
.pill.ready{background:color-mix(in srgb,var(--s3) 14%,transparent);border-color:transparent;color:var(--text)}
.neg{color:var(--bad);font-weight:600}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.st-ok{background:color-mix(in srgb,var(--s3) 16%,transparent)}
.st-warn{background:color-mix(in srgb,var(--s4) 22%,transparent)}
.st-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st-open{background:color-mix(in srgb,var(--s1) 14%,transparent)}
.zero{color:var(--muted)}
.flag{color:var(--warn);font-weight:700;cursor:help}
.grid2{display:grid;gap:10px 28px}
@media (max-width:760px){.grid2{grid-template-columns:1fr!important}}
.side h4{font-size:12px;color:var(--text2);margin:0 0 6px;font-weight:600}
.hb{display:grid;grid-template-columns:76px 1fr 54px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.hb .t{height:12px;background:var(--line2);border-radius:3px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:0 3px 3px 0}
.hb .n{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin:4px 0 6px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;z-index:5}
.empty{color:var(--muted);padding:18px;text-align:center}
.banner{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:9px 14px;margin-bottom:14px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:30px 10px;z-index:50;overflow:auto}
.ov.on{display:flex}
.dlg{background:var(--surface);border-radius:12px;padding:18px;width:min(560px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg.wide{width:min(1100px,100%)}
.dlg h3{margin:0 0 12px;font-size:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%}
.calc{font-size:12px;color:var(--text2);background:var(--bg);border-radius:7px;padding:7px 10px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;align-items:center}
.err{color:var(--bad);font-size:12px;min-height:16px;margin-top:6px}
.eg td{padding:3px}
.eg input,.eg select{width:100%;padding:4px 6px;font-size:13px}
.eg .w60{width:64px}.eg .w80{width:84px}.eg .wb{width:110px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin:6px 0}
</style>
</head>
<body>
<script id="app">
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(+n)||0).toLocaleString('en-US');
const fmt1=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:1});
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mkey=d=>(d||'').slice(0,7);
const mlabel=k=>k?MON[+k.slice(5,7)-1]+' '+k.slice(0,4):'';
const dlabel=d=>d?MON[+d.slice(5,7)-1]+' '+(+d.slice(8,10))+', '+d.slice(0,4):'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const addMonth=(k,n)=>{let y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const monthEnd=k=>iso(new Date(+k.slice(0,4),+k.slice(5,7),0));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const CLASSES=['Light','Prime','Oversize'];

/* ====== PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) ====== */
const SCRIPT_URL='';
/* ======================================================================= */
const LS='hogSupply.gsheet.cache',LSURL='hogSupply.gsheet.url';
let S={settings:{readyAge:150,adg:0.8,lightMax:90,primeMax:120},snaps:[],orders:[]};
let canWrite=true,mode='loading',lastSync=null,busy=0;
const apiUrl=()=>{try{return localStorage.getItem(LSURL)||SCRIPT_URL}catch(e){return SCRIPT_URL}};
const ui={month:mkey(today()),farm:'',cls:'',snap:''};

/* ---- row math ---- */
const mid=r=>{const a=+r.w1||0,b=+r.w2||a;return a&&b?(a+b)/2:(a||b)};
const isFP=r=>r.line!=='BR';
const good=r=>r.g===''||r.g==null?(+r.h||0)-(+r.d||0):+r.g;
function readyDate(r,snapDate){const age=+r.age;if(!age)return snapDate;return addDays(snapDate,Math.max(0,S.settings.readyAge-age))}
function projW(r,snapDate,onDate){const w=mid(r);const dd=Math.max(0,daysBetween(snapDate,onDate||readyDate(r,snapDate)));return w+dd*S.settings.adg}
function cls(w){w=+w;if(w<+S.settings.lightMax)return'Light';if(w<=+S.settings.primeMax)return'Prime';return'Oversize'}
function rowCls(r,snapDate){return cls(projW(r,snapDate))}

/* ---- persistence: Google Sheet via Apps Script ---- */
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function accept(data){S=data;S.orders=S.orders||[];S.snaps=S.snaps||[];lastSync=new Date();mode='sheet';cache();if(!$('#ov').classList.contains('on'))render();else setSync()}
async function load(quiet){
  const u=apiUrl();if(!u){mode='nourl';render();return}
  if(!quiet)setStatus('Loading from Google Sheet…');
  try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error);accept(j.data)}
  catch(e){mode=S.snaps.length||S.orders.length?'offline':'error';render();setStatus('Could not reach the Google Sheet — '+(e.message||e))}
}
async function api(action,payload){
  const u=apiUrl();if(!u){mode='nourl';render();return}
  busy++;render();setStatus('Saving to Google Sheet…');
  try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))});
    const j=await r.json();if(!j.ok)throw new Error(j.error);busy--;accept(j.data);setStatus('Saved to Google Sheet')}
  catch(e){busy--;openDlg(`<h3>Not saved</h3><div>The change could not be saved to the Google Sheet:<br><span class="neg">${esc(e.message||e)}</span></div><div class="muted" style="margin-top:8px">Check your internet connection and try again. The dashboard will now reload what is in the sheet.</div><div class="acts"><button class="pri" data-a="close">OK</button></div>`);load(true)}
}
function setSync(){setStatus(mode==='sheet'?'Google Sheet · synced '+lastSync.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):mode==='offline'?'Offline — showing last loaded data':'')}
function connDlg(){
  openDlg(`<h3>Connect to Google Sheet</h3><div class="muted" style="margin-bottom:8px">Paste the Apps Script <b>Web app URL</b> (Deploy › Manage deployments › Web app URL, ends with <code>/exec</code>). It is remembered on this device. To set it for everyone, put it in <code>SCRIPT_URL</code> in index.html.</div>
  <form id="frm" class="form" onsubmit="return false"><label class="full">Web app URL<input name="url" value="${esc(apiUrl())}" placeholder="https://script.google.com/macros/s/…/exec"></label></form>
  <div class="err" id="err"></div><div class="acts"><button data-a="close">Cancel</button><button class="pri" data-a="saveConn">Connect</button></div>`);
}
function setStatus(t){const el=$('#status');if(el)el.textContent=t}

/* ---- derived ---- */
const liveOrders=()=>S.orders.filter(o=>o.status!=='cancelled');
const allServes=()=>{const out=[];liveOrders().forEach(o=>(o.serves||[]).forEach(sv=>out.push(Object.assign({},sv,{oid:o.id,type:o.type,cls:o.cls,buyer:o.buyer}))));return out};
const servedQty=(o,upto)=>(o.serves||[]).filter(sv=>!upto||sv.date<=upto).reduce((a,sv)=>a+(+sv.heads||0),0);
const orderQty=o=>o.type==='walkin'?servedQty(o):(+o.qty||0);
const farms=()=>[...new Set([...S.snaps.map(s=>s.farm),...S.orders.map(o=>o.farm),...allServes().map(s=>s.farm)].filter(Boolean))].sort();
const buyers=()=>[...new Set(['Vross','Luchay',...S.orders.map(o=>o.buyer)].filter(Boolean))].sort();
const snapsOf=f=>S.snaps.filter(s=>s.farm===f).sort((a,b)=>a.date.localeCompare(b.date));
function latestSnap(f,onOrBefore){const l=snapsOf(f).filter(s=>s.date<=onOrBefore);return l[l.length-1]||null}
function orderOk(o){return(!ui.cls||o.cls===ui.cls)&&(!ui.farm||o.farm===ui.farm||(o.serves||[]).some(sv=>sv.farm===ui.farm))}
function orderStatus(o){
  if(o.status==='cancelled')return['Cancelled','zero'];
  if(o.type==='walkin')return['Served (walk-in)','st-ok'];
  const q=+o.qty||0,s=servedQty(o);
  if(s>q)return['Over-served','st-warn'];if(q&&s>=q)return['Served','st-ok'];
  if(o.need&&o.need<today())return[s?'Partial · overdue':'Overdue','st-bad'];
  return[s?'Partial':'Open',s?'st-warn':'st-open'];
}
function months(){
  const ks=[ui.month];
  S.snaps.forEach(s=>{ks.push(mkey(s.date));s.rows.forEach(r=>{if(isFP(r))ks.push(mkey(readyDate(r,s.date)))})});
  S.orders.forEach(o=>{if(o.need)ks.push(mkey(o.need));(o.serves||[]).forEach(sv=>ks.push(mkey(sv.date)))});
  ks.sort();const out=[];let k=ks[0];const end=ks[ks.length-1];
  while(k<=end&&out.length<48){out.push(k);k=addMonth(k,1)}return out;
}
function monthly(){
  const fl=ui.farm?[ui.farm]:farms();const SV=allServes().filter(sv=>!ui.cls||sv.cls===ui.cls);
  const PRE=liveOrders().filter(o=>o.type==='pre'&&(!ui.cls||o.cls===ui.cls)&&(!ui.farm||o.farm===ui.farm));
  return months().map(k=>{
    const ks=k+'-01',ke=monthEnd(k);
    const o={k,byC:{Light:0,Prime:0,Oversize:0},avail:0,newly:0,soldPrior:0,sold:0,kg:0,soldPreCount:0,basis:[],servedPre:0,servedWalk:0};
    fl.forEach(f=>{
      const sn=latestSnap(f,ke);
      if(sn){o.basis.push(f+': '+dlabel(sn.date));
        sn.rows.forEach(r=>{if(!isFP(r))return;const rd=readyDate(r,sn.date);if(rd>ke)return;
          const c=cls(projW(r,sn.date,rd>ks?rd:(sn.date>ks?sn.date:ks)));if(ui.cls&&c!==ui.cls)return;
          const g=good(r);o.byC[c]+=g;o.avail+=g;if(rd>=ks||sn.date>=ks)o.newly+=g});}
      SV.filter(sv=>sv.farm===f).forEach(sv=>{const after=!sn||sv.date>=sn.date;
        if(sv.date>=ks&&sv.date<=ke){if(after){o.sold+=+sv.heads||0;o.kg+=+sv.kg||0}else o.soldPreCount+=+sv.heads||0;
          if(sv.type==='pre')o.servedPre+=+sv.heads||0;else o.servedWalk+=+sv.heads||0}
        else if(sn&&sv.date<ks&&sv.date>=sn.date)o.soldPrior+=+sv.heads||0;});
    });
    const due=PRE.filter(p=>mkey(p.need)===k);
    o.pre=due.reduce((a,p)=>a+(+p.qty||0),0);
    o.preFilled=due.reduce((a,p)=>a+Math.min(+p.qty||0,servedQty(p)),0);
    o.fill=o.pre?o.preFilled/o.pre:0;
    o.openPre=PRE.filter(p=>p.need&&p.need<=ke).reduce((a,p)=>a+Math.max(0,(+p.qty||0)-servedQty(p,ke)),0);
    o.total=o.avail-o.soldPrior;o.left=o.total-o.sold;o.uncommitted=o.left-o.openPre;o.pct=o.total>0?o.sold/o.total:0;
    return o;
  });
}
/* ---- render ---- */
function render(){
  const M=monthly();const cur=M.find(r=>r.k===ui.month)||M[0]||{byC:{},total:0,sold:0,left:0,pct:0,kg:0,basis:[],newly:0,soldPrior:0,soldPreCount:0,pre:0,fill:0,openPre:0,uncommitted:0,servedPre:0,servedWalk:0};
  const fl=farms();
  let snap=S.snaps.find(s=>s.id===ui.snap);
  if(!snap||(ui.farm&&snap.farm!==ui.farm)){const c=S.snaps.filter(s=>!ui.farm||s.farm===ui.farm).sort((a,b)=>b.date.localeCompare(a.date));snap=c[0]||null;ui.snap=snap?snap.id:''}
  const snapList=S.snaps.filter(s=>!ui.farm||s.farm===ui.farm).sort((a,b)=>b.date.localeCompare(a.date)||a.farm.localeCompare(b.farm));

  $('#root').innerHTML=`
  <header><div><h1>Hog Supply Forecast &amp; Availability</h1>
    <div class="sub">Farm forecasts per building/batch · pre-orders &amp; orders served · monthly available vs served vs left<span class="status" id="status"></span></div></div>
    <div class="btns">${canWrite&&mode==='sheet'&&!busy?`<button class="pri" data-a="newN">+ Farm forecast</button><button class="pri" data-a="newO" data-v="pre">+ Pre-order</button><button class="pri" data-a="newO" data-v="walkin">+ Walk-in sale</button><button data-a="settings">Settings</button>`:''}<button data-a="reload" title="Reload from Google Sheet">↻ Refresh</button><button data-a="export">Copy data (Excel)</button></div></header>
  ${mode==='nourl'?`<div class="banner">Not connected to a Google Sheet yet. <button class="sm" data-a="conn">Connect</button></div>`:''}
  ${mode==='error'?`<div class="banner">Could not load the Google Sheet. <button class="sm" data-a="reload">Try again</button> <button class="sm" data-a="conn">Check connection</button></div>`:''}
  ${mode==='offline'?`<div class="banner">Offline — showing the data last loaded on this device. Changes can't be saved until the sheet is reachable. <button class="sm" data-a="reload">Try again</button></div>`:''}
  <div class="filters">
    <label>Month <select id="fMonth">${months().map(k=>`<option value="${k}" ${k===ui.month?'selected':''}>${mlabel(k)}</option>`).join('')}</select></label>
    <label>Farm <select id="fFarm"><option value="">All farms</option>${fl.map(f=>`<option ${f===ui.farm?'selected':''}>${esc(f)}</option>`).join('')}</select></label>
    <label>Weight class <select id="fCls"><option value="">All classes</option>${CLASSES.map(c=>`<option ${c===ui.cls?'selected':''}>${c}</option>`).join('')}</select></label>
    <span class="muted">Marketable at ${S.settings.readyAge} days · Light &lt; ${S.settings.lightMax} kg · Prime ${S.settings.lightMax}–${S.settings.primeMax} kg · Oversize &gt; ${S.settings.primeMax} kg (projected at ready date, +${S.settings.adg} kg/day)</span>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l"><span class="dot" style="background:var(--s1)"></span>Available to sell · ${mlabel(ui.month)}</div><div class="v">${fmt(cur.total)}</div><div class="n">${CLASSES.map(c=>`${c} ${fmt(cur.byC[c]||0)}`).join(' · ')}</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:var(--s2)"></span>Pre-orders due</div><div class="v">${fmt(cur.pre)}</div><div class="n">${cur.pre?Math.round(cur.fill*100)+'% filled ('+fmt(cur.preFilled)+' served)':'none booked for this month'}</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:var(--s3)"></span>Actual served</div><div class="v">${fmt(cur.servedPre+cur.servedWalk)}</div><div class="n">${fmt(cur.servedPre)} on pre-order · ${fmt(cur.servedWalk)} walk-in · ${fmt(cur.kg)} kg</div></div>
    <div class="kpi"><div class="l">Open pre-orders (to serve)</div><div class="v ${cur.openPre?'':'zero'}">${fmt(cur.openPre)}</div><div class="n">unserved balance due by month-end, incl. overdue</div></div>
    <div class="kpi"><div class="l"><span class="dot" style="background:var(--s4)"></span>Left (unsold)</div><div class="v ${cur.left<0?'neg':''}">${fmt(cur.left)}</div><div class="n">${cur.left<0?'Served more than forecast':'available − served'}</div></div>
    <div class="kpi"><div class="l">Free to sell (uncommitted)</div><div class="v ${cur.uncommitted<0?'neg':''}">${fmt(cur.uncommitted)}</div><div class="n">${cur.uncommitted<0?'Short: pre-orders exceed what is left':'left − open pre-orders'}</div></div>
  </div>

  <section class="panel">
    <div class="ph"><h2>Panel 1 · Farm forecast by building / batch</h2>

function chart(M,SER,id){
  if(!M.length)return'<div class="empty">No data yet.</div>';
  const W=620,H=250,pl=48,pr=10,pt=12,pb=32;
  const max=Math.max(10,...M.map(r=>Math.max(...SER.map(x=>r[x[0]]))));
  const st=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(x=>x*st).find(x=>max/x<=5);const top=Math.ceil(max/nice)*nice;
  const y=v=>pt+(H-pt-pb)*(1-Math.max(v,0)/top);const gw=(W-pl-pr)/M.length;const n=SER.length;const bw=Math.max(4,Math.min(26,(gw-18)/n));
  let g='';for(let v=0;v<=top+1e-9;v+=nice)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  M.forEach((r,i)=>{const cx=pl+gw*i+gw/2,x0=cx-(bw*n+2*(n-1))/2;
    SER.forEach(([k,c],j)=>{const yy=y(r[k]),h=y(0)-yy,x=x0+j*(bw+2),rr=Math.min(4,h,bw/2);
      if(h>0.5)g+=`<path d="M${x},${y(0)}V${yy+rr}Q${x},${yy} ${x+rr},${yy}H${x+bw-rr}Q${x+bw},${yy} ${x+bw},${yy+rr}V${y(0)}Z" fill="${c}"/>`});
    g+=`<text x="${cx}" y="${H-pb+18}" text-anchor="middle" font-size="12" fill="${r.k===ui.month?'var(--text)':'var(--text2)'}" font-weight="${r.k===ui.month?700:400}">${mlabel(r.k)}</text><rect class="hit" data-c="${id}" data-i="${i}" x="${pl+gw*i}" y="${pt}" width="${gw}" height="${H-pt-pb}" fill="transparent" style="cursor:pointer"/>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${id}">${g}</svg>`;
}

  <div style="margin-top:6px"><button class="sm" data-a="addSv">+ Add served delivery</button> <span class="muted" id="stot"></span></div>
  <div class="err" id="err"></div>
  <div class="acts"><button data-a="close">Cancel</button><button class="pri" data-a="saveO" data-id="${isNew?'':o.id}">${isNew?(pre?'Save pre-order':'Save sale'):'Save changes'}</button></div>`,true);
  drawSv();
}
function drawSv(){
  const g=$('#sgrid');if(!g)return;
  g.innerHTML=odraft.serves.length?`<table class="eg"><thead><tr><th>Date served</th><th>Farm</th><th>Building</th><th class="num">Heads</th><th class="num">Total live kg</th><th class="num">Avg kg</th><th></th></tr></thead><tbody>${odraft.serves.map((sv,i)=>`<tr data-i="${i}"><td><input type="date" data-sf="date" value="${esc(sv.date)}"></td><td><input data-sf="farm" list="dlF" value="${esc(sv.farm)}"></td><td><input class="wb" data-sf="bldg" value="${esc(sv.bldg)}"></td><td><input class="w80" type="number" data-sf="heads" value="${esc(sv.heads)}"></td><td><input class="w80" type="number" step="0.1" data-sf="kg" value="${esc(sv.kg)}"></td><td class="num muted">${sv.heads&&sv.kg?fmt1(sv.kg/sv.heads):'—'}</td><td><button class="link danger" data-a="rmSv" data-v="${i}">✕</button></td></tr>`).join('')}</tbody></table>`:'<div class="muted">Nothing served yet.</div>';
  svTot();
}
function svTot(){const t=$('#stot');if(!t)return;const s=odraft.serves.reduce((a,sv)=>a+(+sv.heads||0),0);const q=+(($('#frm')||{}).qty||{}).value||0;
  t.innerHTML=`Served ${fmt(s)} heads`+(odraft.type==='pre'&&q?` of ${fmt(q)} pre-ordered · balance ${fmt(Math.max(0,q-s))}`+(s>q?' · <span class="neg">over-served</span>':''):'')}
function formServe(o){
  const bal=Math.max(0,(+o.qty||0)-servedQty(o));
  openDlg(`<h3>Serve order · ${esc(o.buyer)}</h3><div class="muted" style="margin-bottom:10px">${o.type==='pre'?`Pre-ordered ${fmt(o.qty)} · served so far ${fmt(servedQty(o))} · balance ${fmt(bal)}`:'Walk-in sale'}</div>
  <form id="frm" class="form" onsubmit="return false">
    <label>Date served<input name="date" type="date" value="${today()}" required></label>
    <label>Heads served<input name="heads" type="number" min="1" step="1" value="${bal||''}" required></label>
    <label>Farm<input name="farm" list="dlF" value="${esc(o.farm||(ui.farm||farms()[0]||''))}" required>${dl('dlF',farms())}</label>
    <label>Building (optional)<input name="bldg"></label>
    <label class="full">Total live weight (kg)<input name="kg" type="number" min="0" step="0.1"></label>
  </form><div class="acts"><button data-a="close">Cancel</button><button class="pri" data-a="saveServe" data-id="${o.id}">Save served</button></div>`);
}
function formSettings(){
  const st=S.settings;openDlg(`<h3>Settings</h3><form id="frm" class="form">
   <label>Marketable age (days)<input name="readyAge" type="number" value="${st.readyAge}"></label>
   <label>Avg daily gain for projection (kg/day)<input name="adg" type="number" step="0.05" value="${st.adg}"></label>
   <label>Light: below (kg)<input name="lightMax" type="number" step="0.1" value="${st.lightMax}"></label>
   <label>Prime: up to (kg)<input name="primeMax" type="number" step="0.1" value="${st.primeMax}"></label>
   <div class="calc full">Weight class uses the projected weight on the date the batch becomes sellable: midpoint of the estimated range + days to go × daily gain. Above the Prime limit = Oversize.</div>
  </form><div class="err" id="err"></div><div class="acts"><button data-a="conn" style="margin-right:auto">Google Sheet connection…</button><button data-a="close">Cancel</button><button class="pri" data-a="saveSet">Save</button></div>`);
}
function exportDlg(){
  const T=r=>r.map(v=>String(v==null?'':v).replace(/[\t\n]/g,' ')).join('\t');const L=[];
  S.snaps.slice().sort((a,b)=>a.farm.localeCompare(b.farm)||a.date.localeCompare(b.date)).forEach(sn=>{L.push(T(['FARM FORECAST',sn.farm,sn.date]));L.push(T(['Building','Line','Heads','Good','Defective','Wt from','Wt to','Age','Ready date','Proj kg','Class','Remarks']));
    sn.rows.forEach(r=>{const fp=isFP(r);L.push(T([r.b,fp?'Final product':'Breeders',r.h,good(r),r.d,r.w1,r.w2,r.age,fp?readyDate(r,sn.date):'',fp?fmt1(projW(r,sn.date)):'',fp?rowCls(r,sn.date):'',r.rm]))});L.push('')});
  L.push(T(['MONTHLY LOG'+(ui.farm?' – '+ui.farm:'')+(ui.cls?' – '+ui.cls:'')]));L.push(T(['Month','Ready Light','Ready Prime','Ready Oversize','Served earlier since count','Available to sell','Pre-orders due','Served on pre-order','Served walk-in','Actual served','Served kg','Fill rate','Open pre-orders','Left','Free to sell']));
  monthly().forEach(r=>L.push(T([mlabel(r.k),r.byC.Light,r.byC.Prime,r.byC.Oversize,r.soldPrior,r.total,r.pre,r.servedPre,r.servedWalk,r.sold,r.kg,r.pre?Math.round(r.fill*100)+'%':'',r.openPre,r.left,r.uncommitted])));L.push('');
  L.push(T(['ORDERS']));L.push(T(['Type','Customer','Ordered on','Needed by','Farm','Class','Pre-ordered','Served','Balance','Status','Notes']));
  S.orders.forEach(o=>{const q=orderQty(o),sv=servedQty(o);L.push(T([o.type==='pre'?'Pre-order':'Walk-in',o.buyer,o.odate,o.need,o.farm,o.cls,o.type==='pre'?q:'',sv,o.type==='pre'&&o.status!=='cancelled'?Math.max(0,q-sv):'',orderStatus(o)[0],o.notes]))});L.push('');
  L.push(T(['SERVED DELIVERIES']));L.push(T(['Date served','Customer','Order type','Farm','Building','Class','Heads','Total kg']));
  allServes().sort((a,b)=>a.date.localeCompare(b.date)).forEach(sv=>L.push(T([sv.date,sv.buyer,sv.type==='pre'?'Pre-order':'Walk-in',sv.farm,sv.bldg,sv.cls,sv.heads,sv.kg])));
  openDlg(`<h3>Copy data to Excel / Google Sheets</h3><div class="muted" style="margin-bottom:8px">Copy, then paste into cell A1 of a blank sheet.</div><textarea id="exp" style="width:100%;height:260px;font-family:ui-monospace,monospace;font-size:11px" readonly>${esc(L.join('\n'))}</textarea><div class="acts"><span id="cpm" class="muted" style="margin-right:auto"></span><button data-a="close">Close</button><button class="pri" data-a="copy">Copy</button></div>`);
}
const confirmDlg=(msg,act,id)=>openDlg(`<h3>Please confirm</h3><div>${msg}</div><div class="acts"><button data-a="close">Cancel</button><button class="pri" style="background:var(--bad);border-color:var(--bad)" data-a="${act}" data-id="${id||''}">Delete</button></div>`);

/* ---- events ---- */
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset&&t.dataset.sf&&odraft){const i=+t.closest('tr').dataset.i;odraft.serves[i][t.dataset.sf]=t.type==='number'?(t.value===''?'':+t.value):t.value;if(t.dataset.sf!=='date'&&t.dataset.sf!=='farm'&&t.dataset.sf!=='bldg'){const c=t.closest('tr').children[5];const sv=odraft.serves[i];c.textContent=sv.heads&&sv.kg?fmt1(sv.kg/sv.heads):'—'}svTot();return}
  if(t.name==='qty'&&odraft){svTot();return}if(t.dataset&&t.dataset.f&&draft){const i=+t.closest('tr').dataset.i;const f=t.dataset.f;draft.rows[i][f]=t.type==='number'?(t.value===''?'':+t.value):t.value;gridTot()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.f==='line'&&draft){draft.rows[+t.closest('tr').dataset.i].line=t.value;gridTot();return}
  if(t.id==='fMonth'){ui.month=t.value;render()}if(t.id==='fFarm'){ui.farm=t.value;ui.snap='';render()}if(t.id==='fCls'){ui.cls=t.value;render()}if(t.id==='fSnap'){ui.snap=t.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='close')return closeDlg();
  if(a==='newN')return formN();if(a==='editN')return formN(S.snaps.find(s=>s.id===id));
  if(a==='newO')return formO(null,b.dataset.v);if(a==='editO')return formO(S.orders.find(o=>o.id===id));
  if(a==='serveO')return formServe(S.orders.find(o=>o.id===id));
  if(a==='addSv'){odraft.serves.push({date:today(),farm:($('#frm').farm||{}).value||'',bldg:'',heads:'',kg:''});return drawSv()}
  if(a==='rmSv'){odraft.serves.splice(+b.dataset.v,1);return drawSv()}
  if(a==='settings')return formSettings();if(a==='export')return exportDlg();
  if(a==='pickM'){ui.month=b.dataset.v;return render()}
  if(a==='addRow'){const l=draft.rows[draft.rows.length-1];draft.rows.push({b:l?l.b:'',h:'',g:'',d:0,line:'FP',w1:'',w2:'',age:'',rm:''});return drawGrid()}
  if(a==='rmRow'){draft.rows.splice(+b.dataset.v,1);return drawGrid()}
  if(a==='doPaste'){const rows=parsePaste($('#paste').value);if(!rows.length){$('#pmsg').textContent='No rows recognised — check the column order.';return}
    draft.rows=b.dataset.v==='replace'?rows:draft.rows.filter(r=>r.h!==''||r.b).concat(rows);drawGrid();$('#pmsg').textContent=rows.length+' rows added — check them below.';return}
  if(a==='saveN'){draft.farm=$('#nFarm').value.trim();draft.date=$('#nDate').value;draft.notes=$('#nNotes').value.trim();
    draft.rows=draft.rows.filter(r=>r.b||r.h);
    if(!draft.farm||!draft.date){$('#err').textContent='Farm and forecast date are required.';return}
    if(!draft.rows.length){$('#err').textContent='Add at least one row.';return}
    if(S.snaps.some(s=>s.id!==id&&s.farm.toLowerCase()===draft.farm.toLowerCase()&&s.date===draft.date)){$('#err').textContent='This farm already has a forecast on that date — edit that one instead.';return}
    if(!id)draft.id=uid('n');else draft.id=id;
    ui.snap=draft.id;const snapOut=draft;draft=null;closeDlg();return api('saveSnap',{snap:snapOut})}
  if(a==='delN'){const s=S.snaps.find(x=>x.id===id);return confirmDlg(`Delete the ${esc(s.farm)} forecast dated ${dlabel(s.date)}?`,'doDelN',id)}
  if(a==='doDelN'){ui.snap='';closeDlg();return api('delSnap',{id})}
  if(a==='delO'){const o=S.orders.find(x=>x.id===id);return confirmDlg(`Delete the ${o.type==='pre'?'pre-order':'walk-in sale'} for <b>${esc(o.buyer)}</b> and all its served deliveries? To keep the record, Edit it and set Status to Cancelled instead.`,'doDelO',id)}
  if(a==='doDelO'){closeDlg();return api('delOrder',{id})}
  if(a==='reload')return load();
  if(a==='conn')return connDlg();
  if(a==='copy'){try{await navigator.clipboard.writeText($('#exp').value);$('#cpm').textContent='Copied — paste into a sheet.'}catch(err){$('#exp').select();$('#cpm').textContent='Press Ctrl+C / ⌘C to copy.'}return}
  const frm=$('#frm');
  if(a==='saveO'){if(!frm.reportValidity())return;const d=Object.fromEntries(new FormData(frm));
    const sv=odraft.serves.filter(x=>x.date||x.heads).map(x=>({id:x.id||'',date:x.date,farm:String(x.farm||'').trim(),bldg:String(x.bldg||'').trim(),heads:+x.heads||0,kg:x.kg===''?'':+x.kg}));
    if(sv.some(x=>!x.date||!x.heads||!x.farm)){$('#err').textContent='Each served delivery needs a date, a farm and the number of heads.';return}
    if(odraft.type==='walkin'&&!sv.length){$('#err').textContent='Add at least one served delivery for a walk-in sale.';return}
    const rec={type:odraft.type,buyer:d.buyer.trim(),odate:d.odate||'',need:odraft.type==='pre'?d.need:(sv.map(x=>x.date).sort()[0]||d.odate),farm:(d.farm||'').trim()||(odraft.type==='walkin'&&sv[0]?sv[0].farm:''),cls:d.cls,qty:odraft.type==='pre'?+d.qty:'',notes:d.notes.trim(),status:d.status||odraft.status||'active',serves:sv};
    rec.id=id||uid('o');
    ui.month=mkey(rec.need||today());odraft=null;closeDlg();return api('saveOrder',{order:rec})}
  if(a==='saveServe'){if(!frm.reportValidity())return;const d=Object.fromEntries(new FormData(frm));const o=JSON.parse(JSON.stringify(S.orders.find(x=>x.id===id)));
    (o.serves=o.serves||[]).push({date:d.date,farm:d.farm.trim(),bldg:d.bldg.trim(),heads:+d.heads,kg:d.kg===''?'':+d.kg});
    ui.month=mkey(d.date);closeDlg();return api('saveOrder',{order:o})}
  if(a==='saveConn'){const u=frm.url.value.trim();if(u&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){$('#err').textContent='That does not look like an Apps Script web app URL.';return}
    try{u?localStorage.setItem(LSURL,u):localStorage.removeItem(LSURL)}catch(e){}closeDlg();return load()}
  if(a==='saveSet'){const d=Object.fromEntries(new FormData(frm));const st={readyAge:+d.readyAge,adg:+d.adg,lightMax:+d.lightMax,primeMax:+d.primeMax};
    if(!(st.readyAge>0&&st.adg>=0&&st.lightMax>0&&st.primeMax>st.lightMax)){$('#err').textContent='Check the values: Prime limit must be above the Light limit.';return}
    closeDlg();return api('saveSettings',{settings:st})}
});

/* ---- boot ---- */
const root=document.createElement('div');root.className='wrap';root.id='root';document.body.appendChild(root);
const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.innerHTML='<div class="dlg" id="dlg"></div>';document.body.appendChild(ov);
ov.addEventListener('mousedown',e=>{if(e.target===ov)closeDlg()});
try{const c=JSON.parse(localStorage.getItem(LS)||'null');if(c&&c.snaps)S=c}catch(e){}
render();load();
setInterval(()=>{if(document.visibilityState==='visible'&&!busy&&!$('#ov').classList.contains('on'))load(true)},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!busy&&lastSync&&Date.now()-lastSync>15000&&!$('#ov').classList.contains('on'))load(true)});
})();
</script>
</body>
</html>
